<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluenta — Đăng Nhập Cổng Lâm Sàng</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/common.css" rel="stylesheet">
  <link href="assets/css/login.css" rel="stylesheet">
</head>

<body>


  <header class="med-navbar">
    <div class="container med-w-xs">
      <div class="text-center py-2">
        <a class="med-brand d-inline-block" href="landing.html" aria-label="Fluenta">
          <img class="med-brand-logo" src="assets/images/logo_fluenta.png" alt="Fluenta Healthcare Solutions">
        </a>
      </div>
    </div>
  </header>

  <main class="med-container med-w-xs">

    <section class="med-card">
      <div class="med-card-header">
        <h1 class="med-page-title">Đăng nhập hồ sơ điều trị</h1>
      </div>

      <form id="loginForm">
        <div class="med-form-group">
          <label class="med-label" for="userEmail">Mã hồ sơ hoặc Email đã đăng ký</label>
          <input type="text" id="userEmail" class="med-input" placeholder="Ví dụ: FL-2026-0842 hoặc email@example.com"
            value="FL-2026-0842" required>
        </div>

        <div class="med-form-group">
          <label class="med-label" for="userPass">Mật khẩu xác thực</label>
          <input type="password" id="userPass" class="med-input" value="••••••••" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 small">
          <label for="login-field-1" class="text-muted med-check"><input id="login-field-1" type="checkbox" checked> Ghi
            nhớ đăng nhập trên thiết bị này</label>
          <button type="button" class="med-link-btn text-primary"
            onclick="alert('Tài khoản mẫu đã được điền sẵn thông tin (FL-2026-0842). Bạn có thể bấm Đăng nhập ngay để vào hệ thống.');">Quên
            mật khẩu?</button>
        </div>

        <button type="submit" class="btn-med-primary w-100 py-2">Đăng nhập</button>
      </form>

      <div class="text-center mt-3 pt-3 border-top small">
        <div class="text-muted mb-2">
          Chưa có hồ sơ? <a href="register.html" class="fw-bold text-primary med-link-target">Đăng ký mới tại đây</a>
        </div>
        <div>
          <a href="landing.html" class="btn-med-secondary btn-med-sm d-inline-flex align-items-center gap-1">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Về trang chủ
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer class="med-footer">
    <div class="container text-center">
      <div>Fluenta Clinical System © 2026</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/login.js"></script>
</body>

</html>
