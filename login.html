<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluenta — Đăng Nhập Cổng Lâm Sàng</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/common.css" rel="stylesheet">
  <link href="assets/css/login.css" rel="stylesheet">
</head>
<body>


<header class="med-navbar">
  <div class="container med-w-xs">
    <div class="text-center py-2">
      <a class="med-brand d-inline-block" href="landing.html" aria-label="Fluenta">
        <img class="med-brand-logo" src="assets/images/logo_fluenta.png" alt="Fluenta Healthcare Solutions">
      </a>
    </div>
  </div>
</header>

<main class="med-container med-w-xs">

  <section class="med-card">
    <div class="med-card-header">
      <h1 class="med-page-title">Đăng nhập hồ sơ điều trị</h1>
    </div>

    <form id="loginForm">
      <div class="med-form-group">
        <label class="med-label" for="userEmail">Mã hồ sơ hoặc Email đã đăng ký</label>
        <input type="text" id="userEmail" class="med-input" placeholder="Ví dụ: FL-2026-0842 hoặc email@example.com" value="FL-2026-0842" required>
      </div>

      <div class="med-form-group">
        <label class="med-label" for="userPass">Mật khẩu xác thực</label>
        <input type="password" id="userPass" class="med-input" value="••••••••" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 small">
        <label for="login-field-1" class="text-muted med-check"><input id="login-field-1" type="checkbox" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
        <button type="button" class="med-link-btn text-primary" onclick="alert('Tài khoản mẫu đã được điền sẵn thông tin (FL-2026-0842). Bạn có thể bấm Đăng nhập ngay để vào hệ thống.');">Quên mật khẩu?</button>
      </div>

      <button type="submit" class="btn-med-primary w-100 py-2">Đăng nhập vào hệ thống</button>
    </form>

    <div class="text-center mt-3 pt-3 border-top small text-muted">
      Chưa có hồ sơ theo dõi? <a href="register.html" class="fw-bold text-primary med-link-target">Đăng ký mới tại đây</a>
      <span class="mx-2">·</span>
      <a href="landing.html" class="text-muted med-link-target">Về trang chủ</a>
    </div>
  </section>

  <div class="med-disclaimer-box text-center">
    Hệ thống mã hóa dữ liệu đầu cuối bảo vệ quyền riêng tư âm thanh người bệnh.
  </div>

</main>

<footer class="med-footer">
  <div class="container text-center">
    <div>Fluenta Clinical System © 2026</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
