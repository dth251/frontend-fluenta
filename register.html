<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluenta — Đăng Ký Hồ Sơ Luyện Tập Mới</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/common.css" rel="stylesheet">
  <link href="assets/css/register.css" rel="stylesheet">
</head>
<body>


<header class="med-navbar">
  <div class="container med-w-sm">
    <div class="text-center py-2">
      <a class="med-brand d-inline-block" href="landing.html" aria-label="Fluenta">
        <img class="med-brand-logo" src="assets/images/logo_fluenta.png" alt="Fluenta Healthcare Solutions">
      </a>
    </div>
  </div>
</header>

<main class="med-container med-w-sm">

  <!-- TRACKER 3 BƯỚC -->
  <div class="step-tracker">
    <div class="step-item active">1. Tạo tài khoản</div>
    <div class="step-item">2. Khảo sát bệnh sử</div>
    <div class="step-item">3. Đo mốc ban đầu</div>
  </div>

  <section class="med-card">
    <div class="med-card-header">
      <h1 class="med-page-title">Khởi tạo hồ sơ bệnh án điện tử</h1>
    </div>

    <form id="registerForm">
      <div class="med-form-group">
        <label class="med-label" for="regName">Họ và tên đầy đủ</label>
        <input type="text" id="regName" class="med-input" placeholder="Ví dụ: Nguyễn Văn Minh" required>
      </div>

      <div class="row g-2">
        <div class="col-6">
          <div class="med-form-group">
            <label class="med-label" for="regBirthYear">Năm sinh</label>
            <input type="number" id="regBirthYear" class="med-input" placeholder="2002" required>
          </div>
        </div>
        <div class="col-6">
          <div class="med-form-group">
            <label class="med-label" for="regGender">Giới tính</label>
            <select id="regGender" class="med-select">
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="other">Khác</option>
            </select>
          </div>
        </div>
      </div>

      <div class="med-form-group">
        <label class="med-label" for="regEmail">Địa chỉ Email liên hệ</label>
        <input type="email" id="regEmail" class="med-input" placeholder="email@example.com" required>
      </div>

      <div class="med-form-group">
        <label class="med-label" for="regPass">Mật khẩu bảo mật</label>
        <input type="password" id="regPass" class="med-input" placeholder="Tối thiểu 8 ký tự" required>
      </div>

      <div class="mb-3 small">
        <label class="med-check" for="register-field-1">
          <input id="register-field-1" type="checkbox" required>
          <span class="med-check-text text-muted"><span class="text-nowrap">Tôi đồng ý với</span> <a href="privacy.html" class="fw-semibold text-primary">Chính sách bảo mật dữ liệu âm thanh y tế</a> của Fluenta và xác nhận tham gia chương trình luyện tập.</span>
        </label>
      </div>

      <button type="submit" class="btn-med-primary w-100 py-2">Tiếp tục đến khảo sát ban đầu</button>
    </form>

    <div class="text-center mt-3 pt-3 border-top small">
      <div class="text-muted mb-2">
        Đã có hồ sơ? <a href="login.html" class="fw-bold text-primary med-link-target">Đăng nhập tại đây</a>
      </div>
      <div>
        <a href="landing.html" class="btn-med-secondary btn-med-sm d-inline-flex align-items-center gap-1">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Về trang chủ
        </a>
      </div>
    </div>
  </section>

</main>

<footer class="med-footer">
  <div class="container text-center">
    <div>Fluenta Clinical System © 2026</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
